<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Kendi Tech | أدوات الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <!-- Marked.js Parsing Engine for Beautiful Code & Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        
        /* Markdown Output Styles */
        .markdown-content h1, .markdown-content h2, .markdown-content h3 { font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; color: #f8fafc; }
        .markdown-content p { margin-bottom: 0.75rem; line-height: 1.7; }
        .markdown-content ul { list-style-type: disc; margin-right: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-content ol { list-style-type: decimal; margin-right: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-content code { background-color: #0f172a; color: #38bdf8; padding: 0.2rem 0.4rem; border-radius: 0.375rem; font-family: monospace; font-size: 0.875rem; }
        .markdown-content pre { background-color: #020617; padding: 1rem; border-radius: 0.75rem; overflow-x: auto; margin-top: 0.75rem; margin-bottom: 0.75rem; border: 1px solid #1e293b; position: relative; }
        .markdown-content pre code { background-color: transparent; padding: 0; color: #e2e8f0; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <nav class="bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-50 p-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <a href="/" class="text-blue-400 hover:text-blue-300 font-bold flex items-center gap-2 text-sm md:text-base transition">
                <i class="fa-solid fa-arrow-right"></i> العودة للرئيسية
            </a>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-purple-500/20 text-purple-400 flex items-center justify-center">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <h1 class="text-lg md:text-xl font-bold text-white">قسم الذكاء الاصطناعي</h1>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-8">
        
        <!-- Tab Controls -->
        <div class="bg-slate-800/60 p-1.5 rounded-2xl border border-slate-700/80 flex gap-2 mb-8">
            <button id="tab-text-btn" onclick="switchTab('text')" 
                class="flex-1 py-3 px-4 rounded-xl font-bold text-sm md:text-base transition-all duration-300 flex items-center justify-center gap-2 bg-purple-600 text-white shadow-lg shadow-purple-500/20">
                <i class="fa-solid fa-code"></i> النصوص والأكواد
            </button>
            <button id="tab-image-btn" onclick="switchTab('image')" 
                class="flex-1 py-3 px-4 rounded-xl font-bold text-sm md:text-base transition-all duration-300 flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800">
                <i class="fa-solid fa-wand-magic-sparkles"></i> توليد الصور
            </button>
        </div>

        <!-- Section 1: Text & Code Generation -->
        <div id="section-text" class="space-y-6">
            <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-5 md:p-6 shadow-xl">
                <label class="block text-sm font-bold text-slate-200 mb-2">اكتب طلبك أو الكود الذي تريد تعديله أو شرحه:</label>
                <textarea id="text-prompt" rows="5" 
                    class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-4 text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition font-mono text-sm" 
                    placeholder="مثال: اكتب لي تابع JavaScript للتحقق من قوة كلمة المرور..."></textarea>
                
                <button onclick="generateTextDirect()" id="btn-gen-text" 
                    class="mt-4 w-full bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white font-bold py-3.5 rounded-xl transition duration-300 flex items-center justify-center gap-2 shadow-lg shadow-purple-500/20 active:scale-[0.99]">
                    <i class="fa-solid fa-paper-plane"></i> توليد الإجابة
                </button>
            </div>

            <!-- Output Box -->
            <div id="text-output-box" class="hidden bg-slate-800/80 border border-slate-700 rounded-2xl p-5 md:p-6 shadow-xl relative">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-purple-400 flex items-center gap-2">
                        <i class="fa-solid fa-sparkles"></i> النتيجة:
                    </h3>
                    <button onclick="copyOutput()" id="copy-btn" 
                        class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                        <i class="fa-solid fa-copy"></i> <span>نسخ الكل</span>
                    </button>
                </div>
                <div id="text-output" class="markdown-content text-sm text-slate-200 bg-slate-900 p-5 rounded-xl border border-slate-800 overflow-x-auto leading-relaxed"></div>
            </div>
        </div>

        <!-- Section 2: Image Generation -->
        <div id="section-image" class="hidden space-y-6">
            <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-5 md:p-6 shadow-xl">
                <label class="block text-sm font-bold text-slate-200 mb-2">وصف الصورة (يُفضل بالإنجليزية للحصول على أفضل دقة):</label>
                <input type="text" id="image-prompt" 
                    class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-4 text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition text-sm" 
                    placeholder="e.g., A polar bear wearing glasses in a futuristic library, 8k resolution, cinematic lighting">
                
                <button onclick="generateImageDirect()" id="btn-gen-img" 
                    class="mt-4 w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3.5 rounded-xl transition duration-300 flex items-center justify-center gap-2 shadow-lg shadow-purple-500/20 active:scale-[0.99]">
                    <i class="fa-solid fa-image"></i> إنشاء الصورة
                </button>
            </div>

            <!-- Image Output Box -->
            <div id="image-output-box" class="hidden bg-slate-800/80 border border-slate-700 rounded-2xl p-6 text-center shadow-xl">
                <div id="img-loader" class="hidden py-10">
                    <i class="fa-solid fa-spinner fa-spin text-4xl text-purple-400 mb-3"></i>
                    <p class="text-slate-300 font-medium text-sm">جاري رسم الصورة بالذكاء الاصطناعي...</p>
                </div>

                <div id="img-container" class="hidden space-y-4">
                    <img id="image-result" class="max-w-full h-auto rounded-xl mx-auto border border-slate-700 shadow-2xl" alt="Generated Image">
                    <div>
                        <a id="download-img-btn" download="ai-image.png" target="_blank" 
                            class="inline-flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition shadow">
                            <i class="fa-solid fa-download"></i> تحميل الصورة المباشرة
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Toast Notifications Container -->
    <div id="aiToastContainer" class="fixed bottom-6 left-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- JavaScript Logic -->
    <script>
        function showAiToast(message, type = 'success') {
            const container = document.getElementById('aiToastContainer');
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl bg-slate-800 border ${type === 'success' ? 'border-purple-500/40 text-purple-300' : 'border-red-500/40 text-red-400'} shadow-2xl text-xs font-bold transition-all duration-300 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-purple-400' : 'fa-triangle-exclamation text-red-400'}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        function switchTab(tab) {
            const textSection = document.getElementById('section-text');
            const imageSection = document.getElementById('section-image');
            const textBtn = document.getElementById('tab-text-btn');
            const imageBtn = document.getElementById('tab-image-btn');

            if (tab === 'text') {
                textSection.classList.remove('hidden');
                imageSection.classList.add('hidden');
                textBtn.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm md:text-base transition-all duration-300 flex items-center justify-center gap-2 bg-purple-600 text-white shadow-lg shadow-purple-500/20";
                imageBtn.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm md:text-base transition-all duration-300 flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800";
            } else {
                imageSection.classList.remove('hidden');
                textSection.classList.add('hidden');
                imageBtn.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm md:text-base transition-all duration-300 flex items-center justify-center gap-2 bg-purple-600 text-white shadow-lg shadow-purple-500/20";
                textBtn.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm md:text-base transition-all duration-300 flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800";
            }
        }

        async function generateTextDirect() {
            const promptInput = document.getElementById('text-prompt');
            const prompt = promptInput ? promptInput.value.trim() : '';

            if (!prompt) {
                showAiToast('يرجى كتابة الطلب أو الكود أولاً', 'error');
                return;
            }

            const btn = document.getElementById('btn-gen-text');
            const outputBox = document.getElementById('text-output-box');
            const outputEl = document.getElementById('text-output');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التفكير...';
            outputBox.classList.remove('hidden');
            outputEl.innerHTML = "<p class='text-slate-400 animate-pulse'><i class='fa-solid fa-circle-notch fa-spin ml-2'></i>جاري الاتصال بالسيرفر لمعالجة الإجابة...</p>";

            try {
                const response = await fetch('/api/ai/text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    throw new Error(data.result || data.message || data.error || `فشل الطلب برمز ${response.status}`);
                }

                const rawResult = data.result || data.message || "لم يتم إرجاع استجابة من الذكاء الاصطناعي.";
                
                if (typeof marked !== 'undefined') {
                    outputEl.innerHTML = marked.parse(rawResult);
                } else {
                    outputEl.textContent = rawResult;
                }

            } catch (err) {
                outputEl.innerHTML = `<p class="text-red-400 font-bold"><i class="fa-solid fa-triangle-exclamation ml-2"></i>${err?.message || "حدث خطأ في الاتصال بالسيرفر. يرجى التحقق من الشبكة وإعادة المحاولة."}</p>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> توليد الإجابة';
            }
        }

        async function generateImageDirect() {
            const prompt = document.getElementById('image-prompt').value.trim();
            if (!prompt) return showAiToast('يرجى كتابة وصف الصورة أولاً', 'error');

            const btn = document.getElementById('btn-gen-img');
            const outputBox = document.getElementById('image-output-box');
            const loader = document.getElementById('img-loader');
            const container = document.getElementById('img-container');
            const imgEl = document.getElementById('image-result');
            const downloadBtn = document.getElementById('download-img-btn');

            btn.disabled = true;
            outputBox.classList.remove('hidden');
            loader.classList.remove('hidden');
            container.classList.add('hidden');

            try {
                const randomSeed = Math.floor(Math.random() * 1000000);
                const imageUrl = `https://pollinations.ai/p/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${randomSeed}&nologo=true`;
                
                imgEl.onload = () => {
                    downloadBtn.href = imageUrl;
                    loader.classList.add('hidden');
                    container.classList.remove('hidden');
                    btn.disabled = false;
                    showAiToast('تم إنشاء الصورة بنجاح!', 'success');
                };

                imgEl.onerror = () => {
                    showAiToast('تعذر إنشاء الصورة، يرجى إعادة المحاولة.', 'error');
                    outputBox.classList.add('hidden');
                    btn.disabled = false;
                };

                imgEl.src = imageUrl;

            } catch (err) {
                showAiToast('حدث خطأ أثناء الاتصال وإنشاء الصورة.', 'error');
                outputBox.classList.add('hidden');
                btn.disabled = false;
            }
        }

        function copyOutput() {
            const text = document.getElementById('text-output').innerText || document.getElementById('text-output').textContent;
            if (!text) return;

            navigator.clipboard.writeText(text).then(() => {
                showAiToast('تم نسخ الإجابة كاملة للترجمة أو الاستخدام!', 'success');
            }).catch(() => {
                showAiToast('تعذر النسخ تلقائياً', 'error');
            });
        }
    </script>
</body>
</html>
